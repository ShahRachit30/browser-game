!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>🧠 Mind Reader Game</title>
  <style>
    body {
      background: #0f2027;
      background: linear-gradient(to right, #2c5364, #203a43, #0f2027);
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      text-align: center;
      padding: 50px;
    }
    h1 {
      font-size: 40px;
      margin-bottom: 10px;
      color: #00e6e6;
    }
    p {
      font-size: 18px;
      margin: 10px 0;
    }
    button {
      padding: 12px 25px;
      font-size: 18px;
      margin-top: 20px;
      border: none;
      background: #00e6e6;
      color: #000;
      border-radius: 10px;
      cursor: pointer;
    }
    .symbol-box {
      margin-top: 30px;
      font-size: 36px;
      color: #ffcc00;
    }
  </style>
</head>
<body>

  <h1>🔮 I Can Read Your Mind!</h1>
  <p>1. Pick any two-digit number (e.g., 42)</p>
  <p>2. Add both digits together (e.g., 4 + 2 = 6)</p>
  <p>3. Subtract the result from your original number (e.g., 42 - 6 = 36)</p>
  <p>4. Find the symbol for your number below and remember it...</p>

  <button onclick="showSymbol()">🧠 Reveal My Symbol</button>

  <div class="symbol-box" id="result"></div>

  <script>
    const symbols = ["★", "☆", "☯", "✦", "✿", "☘", "✧", "❤", "❖", "☠", "☁", "❣", "⚡", "☀", "⚔"];
    const mysterySymbol = symbols[Math.floor(Math.random() * symbols.length)];
    const multiplesOf9 = [9, 18, 27, 36, 45, 54, 63, 72, 81, 90];

    function generateTable() {
      let result = "";
      for (let i = 0; i < 100; i++) {
        let displaySymbol;
        if (multiplesOf9.includes(i)) {
          displaySymbol = mysterySymbol;
        } else {
          displaySymbol = symbols[Math.floor(Math.random() * symbols.length)];
        }
        result += `${i}: ${displaySymbol}<br>`;
      }
      return result;
    }

    function showSymbol() {
      const final = generateTable();
      document.getElementById("result").innerHTML = `
        <p>I know you're thinking of this symbol:</p>
        <div style="font-size:60px; margin:20px;">${mysterySymbol}</div>
        <p>Try again with another number if you dare! 😄</p>
        <hr style="margin: 30px 0; border-color: #555;">
        <h2>Symbol Table:</h2>
        <p>${final}</p>
      `;
    }
  </script>

</body>
</html>
